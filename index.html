  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Suppress Vite HMR WebSocket connection errors in sandbox iframe environment where HMR is disabled
      (function() {
        const _origConsoleError = console.error;
        console.error = function(...args) {
          if (args[0] && (
            (typeof args[0] === 'string' && (args[0].includes('[vite]') || args[0].includes('websocket') || args[0].includes('WebSocket'))) ||
            (args[0] instanceof Error && (args[0].message?.includes('WebSocket') || args[0].stack?.includes('@vite/client')))
          )) {
            console.debug(...args);
            return;
          }
          _origConsoleError.apply(console, args);
        };

        // Capture and silence unhandled rejections from Vite HMR client
        window.addEventListener('unhandledrejection', function(event) {
          const reason = event.reason;
          const msg = typeof reason === 'string' ? reason : (reason?.message || '');
          const stack = reason?.stack || '';
          if (msg.includes('WebSocket') || msg.includes('closed without opened') || stack.includes('@vite/client')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // Capture and silence runtime errors from Vite HMR client
        window.addEventListener('error', function(event) {
          const msg = event.message || '';
          const filename = event.filename || '';
          const stack = event.error?.stack || '';
          if (msg.includes('WebSocket') || msg.includes('closed without opened') || filename.includes('@vite/client') || stack.includes('@vite/client')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // Wrap WebSocket to cleanly mock Vite's HMR socket connection and prevent line 225 rejection
        try {
          const NativeWebSocket = window.WebSocket;
          if (NativeWebSocket) {
            function MockViteWebSocket(url, protocols) {
              const urlStr = String(url || '');
              const protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
              const isViteSocket = urlStr.includes('vite') || protoStr.includes('vite') || protoStr.includes('hmr');

              if (isViteSocket) {
                const listeners = {};
                const mock = {
                  readyState: 1, // OPEN
                  OPEN: 1,
                  CONNECTING: 0,
                  CLOSING: 2,
                  CLOSED: 3,
                  url: urlStr,
                  protocol: protoStr,
                  extensions: '',
                  bufferedAmount: 0,
                  binaryType: 'blob',
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null,
                  send: function() {},
                  close: function() {},
                  addEventListener: function(type, fn) {
                    listeners[type] = listeners[type] || [];
                    listeners[type].push(fn);
                  },
                  removeEventListener: function(type, fn) {
                    if (listeners[type]) {
                      listeners[type] = listeners[type].filter(f => f !== fn);
                    }
                  },
                  dispatchEvent: function(event) {
                    const fns = (listeners[event.type] || []).slice();
                    fns.forEach(fn => {
                      try { fn.call(mock, event); } catch (_) {}
                    });
                    if (typeof mock['on' + event.type] === 'function') {
                      try { mock['on' + event.type](event); } catch (_) {}
                    }
                    return true;
                  }
                };

                // Asynchronously trigger 'open' to satisfy @vite/client line 218 without rejection
                setTimeout(() => {
                  try {
                    mock.dispatchEvent(new Event('open'));
                  } catch (_) {}
                }, 0);

                return mock;
              }

              return new NativeWebSocket(url, protocols);
            }

            MockViteWebSocket.prototype = NativeWebSocket.prototype;
            MockViteWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
            MockViteWebSocket.OPEN = NativeWebSocket.OPEN;
            MockViteWebSocket.CLOSING = NativeWebSocket.CLOSING;
            MockViteWebSocket.CLOSED = NativeWebSocket.CLOSED;
            window.WebSocket = MockViteWebSocket;
          }
        } catch (_) {}
      })();
    </script>
